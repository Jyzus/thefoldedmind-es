events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tipos adicionales requeridos para 3D / GLTF / fuentes
    types {
        model/gltf-binary              glb;
        model/gltf+json                gltf;
        application/json               json;
        application/javascript         js;
        font/woff2                     woff2;
        image/svg+xml                  svg;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Compresión Gzip para HTML, JS, CSS, JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript application/xml image/svg+xml model/gltf+json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Página de error 404 personalizada
        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Cache estática prolongada para modelos 3D y assets pesados
        location ~* \.(glb|bin|jpg|jpeg|png|gif|ico|webp|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            try_files $uri =404;
        }

        # Cache moderada para JS y CSS
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }
    }
}
